<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Boost</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .fade-in {
      animation: fadeIn 0.4s ease-out forwards;
    }

    @keyframes float {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(10deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }

    .float-slow { animation: float 6s ease-in-out infinite; }
    .float-fast { animation: float 4s ease-in-out infinite; }

    @keyframes bounceIn {
      0% { transform: scale(0); opacity: 0; }
      60% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    .bounce-emoji {
      animation: bounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    .theme-ocean { background: linear-gradient(135deg, #dbeafe, #cffafe, #ccfbf1); }
    .theme-sunset { background: linear-gradient(135deg, #ffedd5, #fce7f3, #fef3c7); }
    .theme-space { background: linear-gradient(135deg, #1e1b4b, #312e81, #581c87); }
    .theme-space main { background-color: rgba(30, 27, 75, 0.82); border-color: rgba(255, 255, 255, 0.2); }
    .theme-space h1, .theme-space p { color: #f5f3ff; }
    .reduce-motion *, .reduce-motion *::before, .reduce-motion *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      scroll-behavior: auto !important;
      transition-duration: 0.01ms !important;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-indigo-100 via-purple-100 to-pink-100 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
  <div id="decoration-1" class="decoration absolute top-10 left-10 text-6xl float-slow opacity-60 select-none" aria-hidden="true">🌿</div>
  <div id="decoration-2" class="decoration absolute bottom-12 right-16 text-6xl float-fast opacity-60 select-none" aria-hidden="true">🍵</div>
  <div id="decoration-3" class="decoration absolute top-1/4 right-10 text-5xl float-slow opacity-50 select-none" style="animation-delay: 1s;" aria-hidden="true">☀️</div>
  <div id="decoration-4" class="decoration absolute bottom-1/3 left-12 text-5xl float-fast opacity-50 select-none" style="animation-delay: 2s;" aria-hidden="true">🎈</div>
  <div id="decoration-5" class="decoration absolute top-12 right-1/3 text-4xl float-slow opacity-40 select-none" style="animation-delay: 1.5s;" aria-hidden="true">☁️</div>

  <main class="bg-white/85 backdrop-blur-md shadow-xl rounded-2xl p-8 max-w-md w-full text-center border border-white relative z-10">
    <div id="emoji-icon" class="text-5xl mb-3 bounce-emoji select-none" aria-live="polite">✨</div>
    <h1 class="text-2xl font-bold text-gray-800 mb-2">Daily Boost</h1>
    <p class="text-sm text-gray-500 mb-5">Choose your mood, then get a boost made for you.</p>

    <div class="flex flex-wrap justify-center gap-2 mb-4" role="group" aria-label="Choose a theme">
      <button type="button" data-theme="default" class="theme-button rounded-full bg-purple-100 px-3 py-1 text-xs font-semibold text-purple-800">Candy</button>
      <button type="button" data-theme="ocean" class="theme-button rounded-full bg-cyan-100 px-3 py-1 text-xs font-semibold text-cyan-800">Ocean</button>
      <button type="button" data-theme="sunset" class="theme-button rounded-full bg-orange-100 px-3 py-1 text-xs font-semibold text-orange-800">Sunset</button>
      <button type="button" data-theme="space" class="theme-button rounded-full bg-indigo-100 px-3 py-1 text-xs font-semibold text-indigo-800">Space</button>
    </div>

    <div class="flex items-center gap-2 mb-5">
      <label for="decoration-select" class="whitespace-nowrap text-xs font-semibold text-gray-500">Floating icons</label>
      <select id="decoration-select" class="min-w-0 flex-1 rounded-lg border border-purple-200 bg-white px-3 py-2 text-sm text-gray-700">
        <option value="nature">Nature</option>
        <option value="space">Space</option>
        <option value="food">Food</option>
        <option value="celebrate">Celebrate</option>
        <option value="minimal">Minimal</option>
      </select>
    </div>

    <div class="flex items-center gap-2 mb-5">
      <label for="boost-mode" class="sr-only">Boost mode</label>
      <select id="boost-mode" class="flex-1 rounded-lg border border-purple-200 bg-white px-3 py-2 text-sm text-gray-700">
        <option value="compliment">Compliment mode</option>
        <option value="affirmation">Affirmation mode</option>
        <option value="joke">Silly joke mode</option>
        <option value="challenge">Tiny challenge mode</option>
        <option value="calm">Calm moment mode</option>
      </select>
      <button id="mute-button" type="button" class="rounded-lg bg-gray-100 px-3 py-2 text-sm" aria-pressed="false" aria-label="Turn sound off">🔊</button>
    </div>

    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-6" role="group" aria-label="Choose your mood">
      <button type="button" data-mood="tired" class="mood-button rounded-lg border border-purple-200 bg-purple-50 px-2 py-2 text-sm font-medium text-purple-800 transition hover:bg-purple-100" aria-pressed="true">😴 Tired</button>
      <button type="button" data-mood="happy" class="mood-button rounded-lg border border-transparent bg-gray-50 px-2 py-2 text-sm font-medium text-gray-600 transition hover:bg-yellow-50" aria-pressed="false">😄 Happy</button>
      <button type="button" data-mood="brave" class="mood-button rounded-lg border border-transparent bg-gray-50 px-2 py-2 text-sm font-medium text-gray-600 transition hover:bg-blue-50" aria-pressed="false">🦁 Brave</button>
      <button type="button" data-mood="sad" class="mood-button rounded-lg border border-transparent bg-gray-50 px-2 py-2 text-sm font-medium text-gray-600 transition hover:bg-blue-50" aria-pressed="false">🥺 Sad</button>
    </div>

    <div class="min-h-[100px] flex items-center justify-center bg-purple-50 rounded-xl p-4 mb-6 border border-purple-100 shadow-inner">
      <p id="compliment-text" class="text-lg font-medium text-purple-900 fade-in" aria-live="polite">
        Click the button to get your first compliment!
      </p>
    </div>

    <button id="compliment-button" type="button" class="w-full bg-gradient-to-r from-purple-500 to-pink-500 hover:from-purple-600 hover:to-pink-600 text-white font-semibold py-3 px-6 rounded-xl shadow-lg transform active:scale-95 transition-all duration-150 cursor-pointer">
      Give Me a Compliment 🚀
    </button>
    <button id="surprise-button" type="button" class="mt-3 text-sm font-semibold text-purple-700 underline underline-offset-2">Reveal today's surprise ✨</button>
    <label class="mt-4 flex items-center justify-center gap-2 text-xs text-gray-500">
      <input id="reduce-motion" type="checkbox" class="rounded" />
      Reduce motion
    </label>
  </main>

  <script>
    const complimentsByMood = {
      tired: [
        { text: "You are allowed to take it one tiny, cozy step at a time.", emoji: "🛌" },
        { text: "Even your slow days are still moving you forward.", emoji: "🐢" },
        { text: "You have survived every difficult day before this one.", emoji: "🌤️" }
      ],
      happy: [
        { text: "Your good mood is so contagious, Wi-Fi is trying to catch it.", emoji: "📶" },
        { text: "You are basically a walking confetti cannon of joy.", emoji: "🎉" },
        { text: "Your laugh makes ordinary moments feel legendary.", emoji: "😂" }
      ],
      brave: [
        { text: "You have the kind of courage that makes dragons check their calendars.", emoji: "🐉" },
        { text: "You do not need to feel fearless to be incredibly brave.", emoji: "🛡️" },
        { text: "The next chapter is lucky to have you as its main character.", emoji: "📖" }
      ],
      sad: [
        { text: "You do not have to carry everything alone; you deserve care and kindness too.", emoji: "🫶" },
        { text: "This feeling is heavy, but it is not forever. Be gentle with yourself today.", emoji: "🌈" },
        { text: "Even on cloudy days, there is still something bright about you.", emoji: "☁️" }
      ]
    };

    const modeMessages = {
      affirmation: [
        { text: "You are becoming someone your future self will be proud of.", emoji: "🌱" },
        { text: "You bring value simply by being exactly who you are.", emoji: "💎" },
        { text: "You can take up space, take your time, and trust your pace.", emoji: "🌟" }
      ],
      joke: [
        { text: "You are nacho average human. (Sorry, we had to.)", emoji: "🧀" },
        { text: "You are doing great. Please accept this official internet cookie.", emoji: "🍪" },
        { text: "Your vibe is so good, even your browser tabs feel organized.", emoji: "🖥️" }
      ],
      challenge: [
        { text: "Take one sip of water and do one tiny thing future-you will thank you for.", emoji: "💧" },
        { text: "Send someone a kind message before this boost ends.", emoji: "💌" },
        { text: "Stretch your shoulders, take a breath, and celebrate showing up.", emoji: "🙆" }
      ],
      calm: [
        { text: "Inhale for four, exhale for six. You are safe to slow down.", emoji: "🌬️" },
        { text: "Notice three things you can see, two you can hear, and one you can feel.", emoji: "🪷" },
        { text: "Nothing needs to be solved in this exact minute.", emoji: "🕯️" }
      ]
    };

    const decorationSets = {
      nature: ["🌿", "🍵", "☀️", "🎈", "☁️"],
      space: ["🪐", "🌙", "⭐", "🚀", "🌌"],
      food: ["🍕", "🍩", "🍓", "🍔", "🍪"],
      celebrate: ["🎉", "🎊", "✨", "🎈", "🎁"],
      minimal: ["•", "○", "✦", "·", "◇"]
    };

    let selectedMood = "tired";
    let lastIndex = -1;
    let soundMuted = localStorage.getItem("dailyBoostMuted") === "true";

    function playPopSound() {
      if (soundMuted) return;
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;

        const audioContext = new AudioContext();
        const oscillator = audioContext.createOscillator();
        const gainNode = audioContext.createGain();

        oscillator.type = "sine";
        oscillator.frequency.setValueAtTime(400, audioContext.currentTime);
        oscillator.frequency.exponentialRampToValueAtTime(800, audioContext.currentTime + 0.1);
        gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.15);

        oscillator.connect(gainNode);
        gainNode.connect(audioContext.destination);
        oscillator.start();
        oscillator.stop(audioContext.currentTime + 0.15);
      } catch (error) {
        // Audio may be unavailable in the current browser context.
      }
    }

    function fireConfetti() {
      if (typeof confetti !== "function") return;

      confetti({
        particleCount: 50,
        spread: 60,
        origin: { y: 0.7 },
        colors: ["#a855f7", "#ec4899", "#3b82f6", "#eab308"]
      });
    }

    function triggerMagic(surpriseIndex = null) {
      const textBox = document.getElementById("compliment-text");
      const emojiBox = document.getElementById("emoji-icon");
      const mode = document.getElementById("boost-mode").value;
      const compliments = mode === "compliment" ? complimentsByMood[selectedMood] : modeMessages[mode];
      let randomIndex = surpriseIndex;
      if (!Number.isInteger(randomIndex) || randomIndex < 0 || randomIndex >= compliments.length) {
        do {
          randomIndex = Math.floor(Math.random() * compliments.length);
        } while (randomIndex === lastIndex && compliments.length > 1);
      }

      lastIndex = randomIndex;
      textBox.classList.remove("fade-in");
      emojiBox.classList.remove("bounce-emoji");
      void textBox.offsetWidth;
      void emojiBox.offsetWidth;

      textBox.textContent = compliments[randomIndex].text;
      emojiBox.textContent = compliments[randomIndex].emoji;
      textBox.classList.add("fade-in");
      emojiBox.classList.add("bounce-emoji");
      playPopSound();
      fireConfetti();
    }

    function showDailySurprise() {
      const today = new Date().toISOString().slice(0, 10);
      const surpriseKey = `dailyBoostSurprise-${today}`;
      const savedIndex = localStorage.getItem(surpriseKey);
      const options = complimentsByMood[selectedMood];
      const index = savedIndex === null ? Math.floor(Math.random() * options.length) : Number(savedIndex);
      localStorage.setItem(surpriseKey, String(index));
      document.getElementById("boost-mode").value = "compliment";
      triggerMagic(index);
    }

    document.querySelectorAll(".mood-button").forEach((button) => {
      button.addEventListener("click", () => {
        selectedMood = button.dataset.mood;
        lastIndex = -1;
        document.querySelectorAll(".mood-button").forEach((moodButton) => {
          const isSelected = moodButton === button;
          moodButton.setAttribute("aria-pressed", String(isSelected));
          moodButton.classList.toggle("border-purple-200", isSelected);
          moodButton.classList.toggle("bg-purple-50", isSelected);
          moodButton.classList.toggle("text-purple-800", isSelected);
          moodButton.classList.toggle("border-transparent", !isSelected);
          moodButton.classList.toggle("bg-gray-50", !isSelected);
          moodButton.classList.toggle("text-gray-600", !isSelected);
        });
      });
    });

    document.querySelectorAll(".theme-button").forEach((button) => {
      button.addEventListener("click", () => {
        document.body.className = document.body.className.replace(/\btheme-\w+/g, "");
        if (button.dataset.theme !== "default") document.body.classList.add(`theme-${button.dataset.theme}`);
      });
    });

    document.getElementById("decoration-select").addEventListener("change", (event) => {
      const decorations = decorationSets[event.target.value];
      document.querySelectorAll(".decoration").forEach((decoration, index) => {
        decoration.textContent = decorations[index];
      });
      localStorage.setItem("dailyBoostDecorations", event.target.value);
    });

    document.getElementById("mute-button").addEventListener("click", (event) => {
      soundMuted = !soundMuted;
      localStorage.setItem("dailyBoostMuted", String(soundMuted));
      event.currentTarget.textContent = soundMuted ? "🔇" : "🔊";
      event.currentTarget.setAttribute("aria-pressed", String(soundMuted));
      event.currentTarget.setAttribute("aria-label", soundMuted ? "Turn sound on" : "Turn sound off");
    });

    document.getElementById("reduce-motion").addEventListener("change", (event) => {
      document.body.classList.toggle("reduce-motion", event.target.checked);
      localStorage.setItem("dailyBoostReduceMotion", String(event.target.checked));
    });

    const reduceMotion = localStorage.getItem("dailyBoostReduceMotion") === "true";
    document.getElementById("reduce-motion").checked = reduceMotion;
    document.body.classList.toggle("reduce-motion", reduceMotion);
    document.getElementById("mute-button").textContent = soundMuted ? "🔇" : "🔊";
    document.getElementById("mute-button").setAttribute("aria-pressed", String(soundMuted));

    const savedDecorations = localStorage.getItem("dailyBoostDecorations") || "nature";
    document.getElementById("decoration-select").value = savedDecorations;
    document.querySelectorAll(".decoration").forEach((decoration, index) => {
      decoration.textContent = decorationSets[savedDecorations][index];
    });

    document.getElementById("surprise-button").addEventListener("click", showDailySurprise);
    document.getElementById("compliment-button").addEventListener("click", triggerMagic);
  </script>
</body>
</html>
