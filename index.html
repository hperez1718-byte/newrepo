<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff4f1">
  <meta name="description" content="A tiny personality quiz with a cute surprise at the end.">
  <title>Will you? 💌</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #3b2632;
      --muted: #7d6270;
      --rose: #e55369;
      --rose-dark: #b93755;
      --peach: #fff4f1;
      --cream: #fffaf7;
      --line: #f0d9d3;
      --shadow: 0 24px 70px rgba(143, 67, 82, .16);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      background: var(--peach);
      color: var(--ink);
      font-family: ui-rounded, "Avenir Next", "Trebuchet MS", system-ui, sans-serif;
    }

    .scene {
      position: relative;
      display: grid;
      min-height: 100vh;
      place-items: center;
      padding: 28px 18px 48px;
      isolation: isolate;
      background:
        radial-gradient(circle at 12% 18%, rgba(255, 214, 196, .62), transparent 25rem),
        radial-gradient(circle at 88% 80%, rgba(255, 191, 208, .5), transparent 25rem);
    }

    .confetti, .confetti::before, .confetti::after {
      position: absolute;
      content: "";
      pointer-events: none;
    }
    .confetti { inset: 0; z-index: 0; overflow: hidden; }
    .confetti::before {
      width: 11px; height: 25px; left: 9%; top: 22%;
      border-radius: 8px; background: #f1ae46; transform: rotate(32deg);
      box-shadow: 74vw 28vh #d66b86, 81vw -10vh #8cb8a5, 21vw 68vh #e58d75, 61vw 72vh #e6b76e;
    }
    .confetti::after {
      width: 14px; height: 14px; right: 13%; top: 14%;
      border: 4px solid #e98b9c; border-radius: 50%;
      box-shadow: -72vw 61vh #9fc6bd, -11vw 7vh #e5bd74, -6vw 70vh #e58d75;
    }
    .cupid {
      position: absolute;
      right: clamp(-38px, 4vw, 54px);
      bottom: clamp(20px, 8vh, 90px);
      z-index: 0;
      width: clamp(130px, 25vw, 240px);
      opacity: .22;
      transform: rotate(8deg);
      pointer-events: none;
    }
    .cupid svg { display: block; width: 100%; height: auto; }
    .cupid .wing { animation: wing-flutter 3.2s ease-in-out infinite; transform-origin: 52% 48%; }

    .card {
      position: relative;
      z-index: 1;
      width: min(100%, 620px);
      padding: clamp(27px, 6vw, 54px);
      border: 1px solid rgba(255, 255, 255, .9);
      border-radius: 32px;
      background: rgba(255, 250, 247, .88);
      box-shadow: var(--shadow);
      text-align: center;
      backdrop-filter: blur(12px);
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 18px;
      color: var(--rose-dark);
      font-size: .76rem;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    .eyebrow::before, .eyebrow::after { content: "✦"; color: #e8af67; }
    .heart {
      display: grid;
      width: 82px; height: 82px;
      margin: 0 auto 22px;
      place-items: center;
      border-radius: 28px;
      background: #ffe2e4;
      color: var(--rose);
      font-size: 2.7rem;
      animation: bob 4s ease-in-out infinite;
    }
    h1 {
      max-width: 480px;
      margin: 0 auto 13px;
      font-size: clamp(2.15rem, 8vw, 4rem);
      line-height: .98;
      letter-spacing: -.055em;
    }
    .intro {
      max-width: 430px;
      margin: 0 auto;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.6;
    }

    .note {
      margin: 30px 0 25px;
      padding: 23px 22px;
      border: 1px dashed #e5b9b3;
      border-radius: 20px;
      background: #fff;
      text-align: left;
    }
    .note-label {
      margin: 0 0 9px;
      color: var(--rose-dark);
      font-size: .75rem;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .setup { margin: 25px 0 0; text-align: left; }
    .setup label {
      display: block;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: .82rem;
      font-weight: 800;
    }
    .name-input {
      width: 100%;
      min-height: 48px;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      background: #fff;
      color: var(--ink);
      font: inherit;
    }
    .name-input:focus { outline: 3px solid rgba(77, 141, 131, .25); border-color: #4d8d83; }
    .tone-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 13px; }
    .tone {
      min-height: 38px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--muted);
      font-size: .82rem;
    }
    .tone.selected { border-color: var(--rose); background: #ffe7e6; color: var(--rose-dark); }
    .progress-bar { height: 7px; margin: 18px 0 22px; overflow: hidden; border-radius: 99px; background: #f6e5e1; }
    .progress-fill { width: 20%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #e55369, #efaa75); transition: width .35s ease; }
    .options { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; margin-top: 18px; }
    .planner { display: grid; gap: 18px; margin-top: 18px; text-align: left; }
    .planner-group { padding: 14px; border: 1px solid #f2dfda; border-radius: 17px; background: rgba(255, 255, 255, .68); }
    .planner-group h2 { margin: 0 0 10px; color: var(--rose-dark); font-size: .9rem; }
    .planner-group .options { margin-top: 0; }
    .planner-submit { margin-top: 2px; }
    .planner-submit:disabled { opacity: .48; cursor: not-allowed; box-shadow: none; }
    .planner-footer {
      display: grid;
      gap: 7px;
      width: 100%;
      margin-top: 8px;
      padding: 12px;
      border: 1px solid #f0d9d3;
      border-radius: 17px;
      background: rgba(255, 250, 247, .96);
      box-shadow: 0 10px 24px rgba(143, 67, 82, .12);
      text-align: center;
    }
    .planner-footer strong { color: var(--ink); font-size: 1rem; }
    .share-email {
      width: 100%;
      min-height: 44px;
      margin: 8px 0 3px;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      background: #fff;
      color: var(--ink);
      font: inherit;
    }
    .share-email:focus { outline: 3px solid rgba(77, 141, 131, .25); border-color: #4d8d83; }
    .option {
      min-height: 70px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      text-align: left;
    }
    .option.selected { border-color: var(--rose); background: #fff0ef; box-shadow: 0 0 0 3px rgba(229, 83, 105, .12); }
    .option small { display: block; margin-top: 3px; color: var(--muted); font-size: .75rem; font-weight: 600; }
    .result-card { text-align: center; }
    .result-card strong { color: var(--rose-dark); }
    .summary {
      margin-top: 17px;
      padding: 15px;
      border-radius: 15px;
      background: #fff4e9;
      color: var(--ink);
      font-size: .92rem;
      line-height: 1.55;
    }
    .share-status {
      min-height: 20px;
      margin: 10px 0 0;
      color: #36736b;
      font-size: .8rem;
      font-weight: 700;
    }
    #message {
      min-height: 58px;
      margin: 0;
      font-family: Georgia, serif;
      font-size: clamp(1.15rem, 3.5vw, 1.4rem);
      line-height: 1.45;
    }
    .hidden { display: none; }
    .reveal { animation: reveal .55s ease both; }

    .actions { display: grid; gap: 11px; }
    button {
      min-height: 50px;
      border: 0;
      border-radius: 14px;
      padding: 13px 20px;
      color: var(--ink);
      cursor: pointer;
      font: inherit;
      font-weight: 800;
      transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
    }
    button:hover { transform: translateY(-2px); }
    button:active { transform: translateY(0) scale(.98); }
    button:focus-visible { outline: 3px solid #4d8d83; outline-offset: 3px; }
    .primary {
      background: var(--rose);
      color: #fff;
      box-shadow: 0 9px 20px rgba(229, 83, 105, .25);
    }
    .primary:hover { background: var(--rose-dark); }
    .choice-row { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }
    .choice { background: #ffe7e6; color: var(--rose-dark); }
    .choice.alt { background: #edf5f1; color: #36736b; }
    .choice:disabled { opacity: .65; cursor: default; }
    .choice:disabled:hover { transform: none; }
    .tiny {
      margin: 22px 0 0;
      color: #a18891;
      font-size: .8rem;
    }
    .footer-heart { color: var(--rose); }

    @keyframes bob { 0%, 100% { transform: rotate(-4deg) translateY(0); } 50% { transform: rotate(4deg) translateY(-8px); } }
    @keyframes wing-flutter { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-4deg); } }
    @keyframes reveal { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
      button { transition: none; }
    }
    @media (max-width: 390px) {
      .choice-row { grid-template-columns: 1fr; }
      .card { border-radius: 25px; }
    }
  </style>
</head>
<body>
  <main class="scene">
    <div class="confetti" aria-hidden="true"></div>
    <div class="cupid" aria-hidden="true">
      <svg viewBox="0 0 220 220" role="img" aria-label="Decorative Cupid illustration">
        <path d="M104 78c-23-22-47-18-55-3 16-7 31 0 39 13-10 7-16 17-17 29 18-7 31-20 33-39Z" fill="#e55369" class="wing"/>
        <path d="M120 78c23-22 47-18 55-3-16-7-31 0-39 13 10 7 16 17 17 29-18-7-31-20-33-39Z" fill="#e55369" class="wing"/>
        <circle cx="111" cy="75" r="23" fill="#ffd6c8"/>
        <path d="M91 69c3-22 38-25 43 1-10-7-25-8-43-1Z" fill="#9c5260"/>
        <path d="M103 82c5 4 11 4 16 0" fill="none" stroke="#b93755" stroke-linecap="round" stroke-width="3"/>
        <path d="M102 97c-10 18-10 42 5 55h19c13-18 12-37-1-55Z" fill="#f6a1a5"/>
        <path d="M106 149 91 184M119 149l15 35" fill="none" stroke="#b93755" stroke-linecap="round" stroke-width="8"/>
        <path d="m102 183-13 8M135 183l13 8" fill="none" stroke="#b93755" stroke-linecap="round" stroke-width="6"/>
        <path d="M101 112 70 133M126 112l29-17" fill="none" stroke="#ffd6c8" stroke-linecap="round" stroke-width="8"/>
        <path d="m154 95 31-22" fill="none" stroke="#8d5c63" stroke-linecap="round" stroke-width="4"/>
        <path d="M180 77c-17-17-35-8-41 0 15-5 25 2 33 12-8 4-12 10-14 18 16-7 23-18 22-30Z" fill="#e55369"/>
        <path d="M184 71 205 50" fill="none" stroke="#8d5c63" stroke-linecap="round" stroke-width="4"/>
        <path d="m205 50 8 3-5-8" fill="none" stroke="#8d5c63" stroke-linecap="round" stroke-width="3"/>
      </svg>
    </div>
    <article class="card" aria-labelledby="page-title">
      <p class="eyebrow">the perfect date planner</p>
      <div class="heart" aria-hidden="true">♡</div>
      <h1 id="page-title">Will you?</h1>
      <p class="intro">Answer a few very important questions and we’ll reveal your date personality — plus a plan made just for you.</p>

      <div class="progress-bar" aria-hidden="true"><div class="progress-fill" id="progress-fill"></div></div>
      <section class="note" aria-live="polite" aria-atomic="true">
        <p class="note-label" id="progress">step 1 of 8</p>
        <p id="message">What kind of day sounds best?</p>
      </section>

      <div class="actions">
        <div class="options" id="options" role="group" aria-label="Date options"></div>
      </div>
      <p class="tiny">No wrong answers, just excellent taste. <span class="footer-heart" aria-hidden="true">♥</span></p>
    </article>
  </main>

  <script>
    const message = document.querySelector("#message");
    const progress = document.querySelector("#progress");
    const options = document.querySelector("#options");
    const progressFill = document.querySelector("#progress-fill");
    const questions = [
      {
        prompt: "Will you go out with me? 💌",
        answers: [["Yes, absolutely 💗", "yes", "I would love to"], ["You had me at date ✨", "yes", "That sounds cute"], ["I need the details first 👀", "maybe", "Tell me the plan"], ["No, thank you 🌿", "no", "No pressure at all"]]
      },
      {
        prompt: "What should we do and have?",
        answers: [["Dinner and drinks 🍽️🥂", "dinner and drinks", "A tasty classic"], ["A walk and coffee 🚶☕", "walk and coffee", "Fresh air and a cozy treat"], ["A coffee date and dessert ☕🍰", "coffee and dessert", "Sweet drinks and good conversation"], ["A museum visit and lunch 🖼️🥪", "museum and lunch", "Art, stories, and a relaxed bite"], ["A walk and lunch 🚶🥪", "walk and lunch", "Wandering with something delicious"], ["Dinner and dessert 🍝🍰", "dinner and dessert", "A full evening of treats"]]
      },
      {
        prompt: "Which day of the week works best?",
        answers: [["Monday 📅", "Monday", "A fresh start"], ["Tuesday 📅", "Tuesday", "A little midweek magic"], ["Wednesday 📅", "Wednesday", "Break up the week"], ["Thursday 📅", "Thursday", "Almost the weekend"], ["Friday 📅", "Friday", "Start the weekend"], ["Saturday 📅", "Saturday", "A day for adventure"], ["Sunday 📅", "Sunday", "A gentle finish"]]
      },
      {
        prompt: "What time of day sounds best?",
        answers: [["Morning 🌤️", "morning", "Start the day sweetly"], ["Afternoon ☀️", "afternoon", "Perfect wandering weather"], ["Early evening 🌅", "early evening", "The prettiest light"], ["Evening sparkle 🌙", "evening", "Cozy lights and good talks"]]
      },
      {
        prompt: "Choose the date vibe.",
        answers: [["Cozy and relaxed 🧸", "cozy", "No pressure, just us"], ["Fun and playful 🎢", "playful", "Laughs guaranteed"], ["Sweet and romantic 🌹", "romantic", "A little extra special"]]
      },
      {
        prompt: "Where should we meet?",
        answers: [["Somewhere close by 📍", "nearby", "Easy and convenient"], ["A place neither of us has tried 🗺️", "new place", "A tiny adventure"], ["Your favorite spot 💗", "favorite spot", "You get to choose"]]
      },
      {
        prompt: "What should we talk about?",
        answers: [["Big dreams 🌟", "dreams", "Plans for the future"], ["Silly stories 😂", "stories", "Laugh until it hurts"], ["Everything and nothing 💬", "everything", "See where it goes"]]
      }
    ];
    let questionIndex = 0;
    const selections = [];

    function renderQuestion() {
      const question = questions[questionIndex];
      progress.textContent = `step ${questionIndex + 1} of ${questions.length}`;
      message.textContent = question.prompt;
      progressFill.style.width = `${((questionIndex + 1) / questions.length) * 100}%`;
      options.innerHTML = "";
      question.answers.forEach((answer) => {
        const button = document.createElement("button");
        button.className = "option";
        button.type = "button";
        button.dataset.answer = answer[1];
        button.innerHTML = `${answer[0]}<small>${answer[2]}</small>`;
        options.appendChild(button);
        button.addEventListener("click", () => {
          selections[questionIndex] = answer;
          if (answer[1] === "no") {
            showNoResult();
            return;
          }
          if (questionIndex === 0) {
            showAllOptions();
            return;
          }
          questionIndex += 1;
          message.classList.remove("reveal");
          void message.offsetWidth;
          message.classList.add("reveal");
          if (questionIndex < questions.length) {
            renderQuestion();
            button.focus();
          } else {
            showResult();
          }
        });
      });
    }

    function showAllOptions() {
      progress.textContent = "choose your date plan";
      progressFill.style.width = "25%";
      message.textContent = "Now choose your date details all at once ✨";
      options.innerHTML = '<div class="planner" id="planner"></div><div class="planner-footer"><strong>Ready to see our plan?</strong><button class="primary planner-submit" id="submit-plan" type="button" disabled>Reveal our date plan ✨</button><p class="share-status" id="planner-status" role="status">Choose one option in each section to continue.</p></div>';
      const planner = document.querySelector("#planner");
      const submit = document.querySelector("#submit-plan");
      const plannerStatus = document.querySelector("#planner-status");
      questions.slice(1).forEach((question, questionOffset) => {
        const questionIndexForSelection = questionOffset + 1;
        const group = document.createElement("section");
        group.className = "planner-group";
        group.innerHTML = `<h2>${question.prompt}</h2><div class="options"></div>`;
        const groupOptions = group.querySelector(".options");
        question.answers.forEach((answer) => {
          const button = document.createElement("button");
          button.className = "option";
          button.type = "button";
          button.dataset.answer = answer[1];
          button.innerHTML = `${answer[0]}<small>${answer[2]}</small>`;
          groupOptions.appendChild(button);
          button.addEventListener("click", () => {
            selections[questionIndexForSelection] = answer;
            groupOptions.querySelectorAll(".option").forEach((option) => option.classList.remove("selected"));
            button.classList.add("selected");
            const complete = questions.slice(1).every((item, index) => selections[index + 1]);
            submit.disabled = !complete;
            plannerStatus.textContent = complete ? "Everything is ready — submit when you’re happy with your plan." : "Choose one option in each section to continue.";
          });
        });
        planner.appendChild(group);
      });
      submit.addEventListener("click", showResult);
    }

    function showNoResult() {
      progress.textContent = "thank you for being honest";
      progressFill.style.width = "100%";
      message.innerHTML = '<span class="result-card"><strong>Totally okay 🌿</strong><br>Thanks for being honest. There is no pressure, no awkwardness, and no hard feelings.</span>';
      options.innerHTML = '<div class="summary">Your comfort matters most. I hope your day is lovely.</div><button class="choice alt" id="restart" type="button">Start over ↻</button>';
      document.querySelector("#restart").addEventListener("click", () => {
        questionIndex = 0;
        selections.length = 0;
        renderQuestion();
      });
    }

    function showResult() {
      const activity = selections[1][0];
      const day = selections[2][0];
      const time = selections[3][0];
      const vibe = selections[4][1];
      const place = selections[5][0];
      const style = vibe === "playful" ? "Curious Comet" : vibe === "romantic" ? "Daydream Explorer" : "Cozy Spark";
      const personality = style;
      const phrases = {
        "Cozy Spark": [
          "You turn simple plans into the sweetest memories.",
          "Your perfect date feels like a warm hug with excellent snacks.",
          "You are thoughtful, easygoing, and secretly very romantic."
        ],
        "Curious Comet": [
          "You bring the fun wherever you go, and your ideal date has stories waiting to happen.",
          "You are adventurous, bright, and always one spontaneous idea away from a great memory.",
          "You make ordinary plans feel like the beginning of a very good story."
        ],
        "Daydream Explorer": [
          "You notice the little details that make a day feel genuinely special.",
          "You are imaginative, open-hearted, and excellent at finding magic in unexpected places.",
          "Your ideal date has just the right mix of wonder, warmth, and possibility."
        ]
      };
      const phrase = phrases[personality][Math.floor(Math.random() * phrases[personality].length)];
      const subject = `My ideal date is a ${personality}`;
      const body = `My date personality: ${personality}\n\n${phrase}\n\nMy ideal date: ${activity}, on ${day} during ${time}, meeting at ${place}.\n\nHonestly? That sounds like a date I’d love to take you on. 💗`;
      progress.textContent = "your official date card";
      progressFill.style.width = "100%";
      message.innerHTML = `<span class="result-card"><strong>${personality}</strong><br>${phrase}</span>`;
      options.innerHTML = `<div class="summary"><strong>Your ideal date:</strong><br>${activity}, on ${day} during ${time}.<br><small>Meet at: ${place}</small><br><br>Honestly? That sounds like a date I’d love to take you on. 💗</div><div class="planner-group"><h2>Share your date plan</h2><button class="primary" id="share-result" type="button">Share this result ↗</button><label class="share-status" for="share-email">Or enter an email address</label><input class="share-email" id="share-email" type="email" autocomplete="email" placeholder="friend@example.com"><button class="choice" id="email-result" type="button">Open email draft ✉️</button><button class="choice alt" id="copy-result" type="button">Copy result</button><p class="share-status" id="share-status" role="status">If no email app opens, use Copy result.</p></div><button class="choice alt" id="restart" type="button">Build another date ↻</button>`;
      const status = document.querySelector("#share-status");
      const copyText = async () => {
        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(body);
          } else {
            const copyFallback = document.createElement("textarea");
            copyFallback.value = body;
            copyFallback.style.position = "fixed";
            copyFallback.style.opacity = "0";
            document.body.appendChild(copyFallback);
            copyFallback.select();
            document.execCommand("copy");
            copyFallback.remove();
          }
          status.textContent = "Copied! Paste your result into a message or email.";
        } catch (error) {
          status.textContent = "Copy was blocked by the browser. Select the result text and copy it manually.";
        }
      };
      document.querySelector("#share-result").addEventListener("click", async () => {
        if (navigator.share) {
          try {
            await navigator.share({ title: subject, text: body });
            status.textContent = "Shared successfully!";
            return;
          } catch (error) {
            if (error.name === "AbortError") return;
          }
        }
        await copyText();
      });
      document.querySelector("#copy-result").addEventListener("click", copyText);
      document.querySelector("#email-result").addEventListener("click", () => {
        const recipient = document.querySelector("#share-email").value.trim();
        if (!recipient) {
          status.textContent = "Enter an email address first, or use Copy result instead.";
          document.querySelector("#share-email").focus();
          return;
        }
        const mailto = `mailto:${encodeURIComponent(recipient)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
        window.open(mailto, "_blank");
        status.textContent = "Your email draft should be opening. If it does not, use Copy result.";
      });
      document.querySelector("#restart").addEventListener("click", () => {
        questionIndex = 0;
        selections.length = 0;
        renderQuestion();
      });
    }

    renderQuestion();
  </script>
</body>
</html>
