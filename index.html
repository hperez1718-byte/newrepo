<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Boost</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .fade-in {
      animation: fadeIn 0.4s ease-out forwards;
    }

    @keyframes float {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(10deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }

    .float-slow { animation: float 6s ease-in-out infinite; }
    .float-fast { animation: float 4s ease-in-out infinite; }

    @keyframes bounceIn {
      0% { transform: scale(0); opacity: 0; }
      60% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    .bounce-emoji {
      animation: bounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-indigo-100 via-purple-100 to-pink-100 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
  <div class="absolute top-10 left-10 text-6xl float-slow opacity-60 select-none" aria-hidden="true">🦄</div>
  <div class="absolute bottom-12 right-16 text-6xl float-fast opacity-60 select-none" aria-hidden="true">🍕</div>
  <div class="absolute top-1/4 right-10 text-5xl float-slow opacity-50 select-none" style="animation-delay: 1s;" aria-hidden="true">⭐</div>
  <div class="absolute bottom-1/3 left-12 text-5xl float-fast opacity-50 select-none" style="animation-delay: 2s;" aria-hidden="true">🚀</div>
  <div class="absolute top-12 right-1/3 text-4xl float-slow opacity-40 select-none" style="animation-delay: 1.5s;" aria-hidden="true">💖</div>

  <main class="bg-white/85 backdrop-blur-md shadow-xl rounded-2xl p-8 max-w-md w-full text-center border border-white relative z-10">
    <div id="emoji-icon" class="text-5xl mb-3 bounce-emoji select-none" aria-live="polite">✨</div>
    <h1 class="text-2xl font-bold text-gray-800 mb-2">Daily Boost</h1>
    <p class="text-sm text-gray-500 mb-5">Choose your mood, then get a boost made for you.</p>

    <div class="grid grid-cols-3 gap-2 mb-6" role="group" aria-label="Choose your mood">
      <button type="button" data-mood="tired" class="mood-button rounded-lg border border-purple-200 bg-purple-50 px-2 py-2 text-sm font-medium text-purple-800 transition hover:bg-purple-100" aria-pressed="true">😴 Tired</button>
      <button type="button" data-mood="happy" class="mood-button rounded-lg border border-transparent bg-gray-50 px-2 py-2 text-sm font-medium text-gray-600 transition hover:bg-yellow-50" aria-pressed="false">😄 Happy</button>
      <button type="button" data-mood="brave" class="mood-button rounded-lg border border-transparent bg-gray-50 px-2 py-2 text-sm font-medium text-gray-600 transition hover:bg-blue-50" aria-pressed="false">🦁 Brave</button>
    </div>

    <div class="min-h-[100px] flex items-center justify-center bg-purple-50 rounded-xl p-4 mb-6 border border-purple-100 shadow-inner">
      <p id="compliment-text" class="text-lg font-medium text-purple-900 fade-in" aria-live="polite">
        Click the button to get your first compliment!
      </p>
    </div>

    <button id="compliment-button" type="button" class="w-full bg-gradient-to-r from-purple-500 to-pink-500 hover:from-purple-600 hover:to-pink-600 text-white font-semibold py-3 px-6 rounded-xl shadow-lg transform active:scale-95 transition-all duration-150 cursor-pointer">
      Give Me a Compliment 🚀
    </button>
  </main>

  <script>
    const complimentsByMood = {
      tired: [
        { text: "You are allowed to take it one tiny, cozy step at a time.", emoji: "🛌" },
        { text: "Even your slow days are still moving you forward.", emoji: "🐢" },
        { text: "You have survived every difficult day before this one.", emoji: "🌤️" }
      ],
      happy: [
        { text: "Your good mood is so contagious, Wi-Fi is trying to catch it.", emoji: "📶" },
        { text: "You are basically a walking confetti cannon of joy.", emoji: "🎉" },
        { text: "Your laugh makes ordinary moments feel legendary.", emoji: "😂" }
      ],
      brave: [
        { text: "You have the kind of courage that makes dragons check their calendars.", emoji: "🐉" },
        { text: "You do not need to feel fearless to be incredibly brave.", emoji: "🛡️" },
        { text: "The next chapter is lucky to have you as its main character.", emoji: "📖" }
      ]
    };

    let selectedMood = "tired";
    let lastIndex = -1;

    function playPopSound() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;

        const audioContext = new AudioContext();
        const oscillator = audioContext.createOscillator();
        const gainNode = audioContext.createGain();

        oscillator.type = "sine";
        oscillator.frequency.setValueAtTime(400, audioContext.currentTime);
        oscillator.frequency.exponentialRampToValueAtTime(800, audioContext.currentTime + 0.1);
        gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.15);

        oscillator.connect(gainNode);
        gainNode.connect(audioContext.destination);
        oscillator.start();
        oscillator.stop(audioContext.currentTime + 0.15);
      } catch (error) {
        // Audio may be unavailable in the current browser context.
      }
    }

    function fireConfetti() {
      if (typeof confetti !== "function") return;

      confetti({
        particleCount: 50,
        spread: 60,
        origin: { y: 0.7 },
        colors: ["#a855f7", "#ec4899", "#3b82f6", "#eab308"]
      });
    }

    function triggerMagic() {
      const textBox = document.getElementById("compliment-text");
      const emojiBox = document.getElementById("emoji-icon");
      const compliments = complimentsByMood[selectedMood];
      let randomIndex;

      do {
        randomIndex = Math.floor(Math.random() * compliments.length);
      } while (randomIndex === lastIndex && compliments.length > 1);

      lastIndex = randomIndex;
      textBox.classList.remove("fade-in");
      emojiBox.classList.remove("bounce-emoji");
      void textBox.offsetWidth;
      void emojiBox.offsetWidth;

      textBox.textContent = compliments[randomIndex].text;
      emojiBox.textContent = compliments[randomIndex].emoji;
      textBox.classList.add("fade-in");
      emojiBox.classList.add("bounce-emoji");
      playPopSound();
      fireConfetti();
    }

    document.querySelectorAll(".mood-button").forEach((button) => {
      button.addEventListener("click", () => {
        selectedMood = button.dataset.mood;
        lastIndex = -1;
        document.querySelectorAll(".mood-button").forEach((moodButton) => {
          const isSelected = moodButton === button;
          moodButton.setAttribute("aria-pressed", String(isSelected));
          moodButton.classList.toggle("border-purple-200", isSelected);
          moodButton.classList.toggle("bg-purple-50", isSelected);
          moodButton.classList.toggle("text-purple-800", isSelected);
          moodButton.classList.toggle("border-transparent", !isSelected);
          moodButton.classList.toggle("bg-gray-50", !isSelected);
          moodButton.classList.toggle("text-gray-600", !isSelected);
        });
      });
    });

    document.getElementById("compliment-button").addEventListener("click", triggerMagic);
  </script>
</body>
</html>
